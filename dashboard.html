<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Pengajuan Kredit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--bg:#f5f6fa;--card:#fff;--ink:#1c1f26;--muted:#6b7280;--accent:#4f46e5;--danger:#dc2626;--border:#e5e7eb;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);margin:0;color:var(--ink);}
  header{background:var(--card);padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  header h1{font-size:20px;margin:0;}
  .container{max-width:1100px;margin:24px auto;padding:0 16px;}
  .config{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}
  .config label{font-size:13px;color:var(--muted);}
  .config input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;margin-top:4px;}
  .toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:500;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-secondary{background:#eef0ff;color:var(--accent);}
  .btn-danger{background:#fee2e2;color:var(--danger);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink);}
  .tablewrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);background:var(--card);}
  table{width:100%;border-collapse:collapse;background:var(--card);}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px;}
  th{background:#fafafa;color:var(--muted);font-weight:600;white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .actions{display:flex;gap:6px;}
  .actions button{padding:6px 10px;font-size:12px;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
  .search{width:100%;max-width:360px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;}
  .overlay.open{display:flex;}
  .modal{background:var(--card);border-radius:12px;padding:24px;width:100%;max-width:680px;max-height:90vh;overflow:auto;}
  .modal h2{margin-top:0;font-size:18px;}
  .sec{font-size:13px;font-weight:700;color:var(--accent);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
  .grid .full{grid-column:1/-1;}
  @media(max-width:560px){.grid{grid-template-columns:1fr;}}
  .item{background:#fafafa;border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
  .item .k{font-size:11px;color:var(--muted);display:block;margin-bottom:2px;}
  .item .v{font-size:14px;font-weight:500;word-break:break-word;white-space:pre-wrap;}
  .berkas{margin-top:4px;font-size:13px;color:var(--muted);}
  .berkas img{max-width:100%;max-height:180px;display:block;border:1px solid var(--border);border-radius:6px;background:#fff;margin-bottom:8px;}
  .dl{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .status{font-size:13px;color:var(--muted);margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;background:#fff;}
  .field input[readonly]{background:#f1f5f9;}
  .field .other{margin-top:6px;}
  .field small{display:block;margin-top:4px;color:var(--muted);font-size:11px;}
  .field.full{grid-column:1/-1;}
</style>
</head>
<body>

<header>
  <h1>📋 Dashboard Pengajuan Kredit</h1>
  <div class="toolbar" style="margin:0;">
    <button class="btn-primary" id="btnAuth" onclick="toggleAuth()">🔐 Login</button>
    <button class="btn-secondary" onclick="loadData()">🔄 Refresh</button>
    <button class="btn-secondary" onclick="exportExcel()">⬇️ Export Excel</button>
    <button class="btn-primary" onclick="openAdd()">+ Tambah Data</button>
  </div>
</header>

<div class="container">
  <div class="config">
    <label>URL Web App Kredit (Google Apps Script, diakhiri /exec)</label>
    <input id="apiUrl" placeholder="https://script.google.com/macros/s/XXXXXXXX/exec" />
  </div>
  <p class="status" id="status">Klik Login untuk memuat data.</p>
  <input class="search" id="search" placeholder="Cari nama, No. HP, atau tujuan pinjaman..." oninput="renderTable()" />
  <div class="tablewrap"><table>
    <thead><tr><th>Tanggal</th><th>Nama</th><th>No. HP</th><th>Pinjaman</th><th>Jangka Waktu</th><th>Tujuan</th><th>Aksi</th></tr></thead>
    <tbody id="tableBody"><tr><td colspan="7" class="empty">Belum ada data</td></tr></tbody>
  </table></div>
</div>

<!-- Login -->
<div class="overlay" id="loginOverlay"><div class="modal" style="max-width:380px">
  <h2>Login Admin</h2>
  <div class="field"><label>Kunci Admin</label>
    <input id="loginKey" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()"></div>
  <p class="status" id="loginMsg" style="color:#dc2626;margin:8px 0 0"></p>
  <div class="modal-actions"><button class="btn-ghost" onclick="closeLogin()">Batal</button><button class="btn-primary" onclick="doLogin()">Masuk</button></div>
</div></div>

<!-- Detail -->
<div class="overlay" id="detailOverlay"><div class="modal">
  <h2 id="detailTitle">Detail Data</h2><div id="detailBody"></div>
  <div class="modal-actions">
    <button class="btn-ghost" onclick="closeDetail()">Tutup</button>
    <button class="btn-secondary" id="detailPrintBtn">🖨️ Cetak</button>
    <button class="btn-primary" id="detailEditBtn">Edit</button>
  </div>
</div></div>

<!-- Tambah / Edit -->
<div class="overlay" id="modalOverlay"><div class="modal">
  <h2 id="modalTitle">Tambah Data</h2>
  <div id="formBody"></div>
  <div class="sec">Berkas (opsional)</div>
  <div class="grid" id="fileBody"></div>
  <div class="modal-actions">
    <button class="btn-ghost" onclick="closeModal()">Batal</button>
    <button class="btn-primary" id="btnSave" onclick="saveEntry()">Simpan</button>
  </div>
</div></div>

<script src="kredit-print.js"></script>
<script src="kredit-shared.js"></script>
<script>
const $ = id => document.getElementById(id);
let records = [], ADMIN_KEY = '', detailToken = 0;
const fileCache = {};
const BERKAS = [
  { col: 'Foto KTP', label: 'Foto KTP', slug: 'foto-ktp' },
  { col: 'Scan Kartu Keluarga', label: 'Scan Kartu Keluarga', slug: 'kartu-keluarga' },
  { col: 'Scan Buku Nikah', label: 'Scan Buku Nikah', slug: 'buku-nikah' },
  { col: 'Scan Agunan', label: 'Scan Agunan (Sertifikat, BPKB, dll)', slug: 'agunan' },
  { col: 'Scan SIUP-TDP-Ket Usaha', label: 'Scan SIUP/TDP/Ket. Usaha', slug: 'siup-tdp' },
  { col: 'Scan Bukti Bayar', label: 'Scan Bukti Bayar (PLN, PDAM, Telepon, dll)', slug: 'bukti-bayar' },
  { col: 'Scan Rekening Deposito', label: 'Scan Rekening Deposito, dll', slug: 'rekening-deposito' },
  { col: 'Scan Dokumen Lainnya', label: 'Dokumen Lainnya', slug: 'dokumen-lainnya' },
  { col: 'Tanda Tangan', label: 'Tanda Tangan Pemohon', slug: 'tanda-tangan' },
  { col: 'Tanda Tangan 2', label: 'Tanda Tangan Suami/Istri/Orang Tua', slug: 'tanda-tangan-2' },
];
/* Label "Lainnya" memakai nama yang diketik nasabah */
const berkasLabel = (b, r) => (b.col === 'Scan Dokumen Lainnya' && r && r['Nama Dokumen Lainnya'] && r['Nama Dokumen Lainnya'] !== '-')
  ? 'Lainnya: ' + r['Nama Dokumen Lainnya'] : b.label;

/* ---------- URL & login ---------- */
function getUrl() { const u = $('apiUrl').value.trim(); localStorage.setItem('kredit_api_url', u); return u; }
$('apiUrl').value = localStorage.getItem('kredit_api_url') || '';
const setStatus = m => $('status').textContent = m;
function updateAuthUI() { $('btnAuth').textContent = ADMIN_KEY ? '🚪 Logout' : '🔐 Login'; }
function toggleAuth() {
  if (ADMIN_KEY) { ADMIN_KEY = ''; records = []; Object.keys(fileCache).forEach(k => delete fileCache[k]); renderTable(); updateAuthUI(); setStatus('Anda sudah logout. Klik Login untuk memuat data.'); }
  else openLogin();
}
function openLogin() { $('loginMsg').textContent = ''; $('loginKey').value = ''; $('loginOverlay').classList.add('open'); setTimeout(() => $('loginKey').focus(), 50); }
function closeLogin() { $('loginOverlay').classList.remove('open'); }
async function doLogin() {
  const k = $('loginKey').value.trim(), msg = $('loginMsg');
  if (!getUrl()) { msg.textContent = 'Isi dulu URL Web App di halaman utama.'; return; }
  if (!k) { msg.textContent = 'Kunci admin wajib diisi.'; return; }
  ADMIN_KEY = k; msg.style.color = '#6b7280'; msg.textContent = 'Memeriksa...';
  const ok = await loadData();
  msg.style.color = '#dc2626';
  if (ok) { closeLogin(); updateAuthUI(); } else { ADMIN_KEY = ''; msg.textContent = 'Login gagal. Periksa kunci admin atau URL Web App.'; }
}

/* ---------- Data ---------- */
async function loadData() {
  const url = getUrl();
  if (!url) { setStatus('⚠️ Isi dulu URL Web App di atas.'); return false; }
  if (!ADMIN_KEY) { openLogin(); return false; }
  setStatus('Memuat data...');
  try {
    const json = await (await fetch(url, {
      method: 'POST',
      body: JSON.stringify({ action: 'read', key: ADMIN_KEY })
    })).json();
    if (!json.success) throw new Error(json.message);
    if (!Array.isArray(json.data)) throw new Error('Balasan server tidak sesuai. Pastikan Apps Script sudah di-deploy versi terbaru.');
    records = json.data.slice().sort((a, b) => String(b['Timestamp']).localeCompare(String(a['Timestamp'])));
    renderTable();
    setStatus(`Terakhir dimuat: ${new Date().toLocaleTimeString('id-ID')} — ${records.length} data`);
    return true;
  } catch (err) { setStatus('❌ Gagal memuat data: ' + err.message); return false; }
}

function renderTable() {
  const q = $('search').value.trim().toLowerCase();
  const list = records.filter(r => !q || ['Nama Lengkap', 'No. HP', 'Tujuan Pinjaman'].some(h => String(r[h] || '').toLowerCase().includes(q)));
  if (!list.length) { $('tableBody').innerHTML = `<tr><td colspan="7" class="empty">${records.length ? 'Data tidak ditemukan' : 'Belum ada data'}</td></tr>`; return; }
  $('tableBody').innerHTML = list.map(r => {
    const d = new Date(r['Timestamp']);
    return `<tr>
      <td>${isNaN(d) ? '' : d.toLocaleDateString('id-ID')}</td>
      <td>${kEsc(r['Nama Lengkap'])}</td><td>${kEsc(r['No. HP'])}</td>
      <td>Rp ${kEsc(r['Pinjaman Diajukan'])}</td><td>${kEsc(r['Jangka Waktu'])} bln</td><td>${kEsc(r['Tujuan Pinjaman'])}</td>
      <td class="actions">
        <button class="btn-secondary" onclick="showDetail('${kEsc(r['ID'])}')">Detail</button>
        <button class="btn-secondary" onclick="editEntry('${kEsc(r['ID'])}')">Edit</button>
        <button class="btn-danger" onclick="deleteEntry('${kEsc(r['ID'])}')">Hapus</button>
      </td></tr>`;
  }).join('');
}

/* ---------- Berkas ---------- */
function fileIdOf(r, col) {
  const raw = String(r['ID ' + col] || r[col] || ''), m = raw.match(/\/d\/([\w-]+)/);
  return m ? m[1] : (/^[\w-]{20,}$/.test(raw) ? raw : '');
}
async function getFile(r, col) {
  const id = fileIdOf(r, col);
  if (!id) return '';
  if (!fileCache[id]) {
    const json = await (await fetch(getUrl(), {
      method: 'POST',
      body: JSON.stringify({ action: 'file', id: id, key: ADMIN_KEY })
    })).json();
    if (!json.success) throw new Error(json.message);
    fileCache[id] = `data:${json.mime};base64,${json.data}`;
  }
  return fileCache[id];
}

/* ---------- Detail ---------- */
function showDetail(id) {
  const r = records.find(x => x['ID'] === id); if (!r) return;
  $('detailTitle').textContent = r['Nama Lengkap'] || 'Detail Data';
  $('detailBody').innerHTML = KREDIT_GROUPS.map(g => `
    <div class="sec">${kEsc(g.t)}</div>
    <div class="grid">${g.f.map(([h, l, , , , full]) => `
      <div class="item ${full ? 'full' : ''}"><span class="k">${kEsc(l)}</span><span class="v">${kEsc(r[h]) || '-'}</span></div>`).join('')}</div>`).join('')
    + '<div class="sec">Berkas</div><div class="grid">' + BERKAS.map((b, i) => `
            <div class="item"><span class="k">${kEsc(berkasLabel(b, r))}</span><div class="berkas" id="berkas${i}">${fileIdOf(r, b.col) ? 'Memuat...' : 'Belum ada berkas'}</div></div>`).join('') + '</div>';
  $('detailPrintBtn').onclick = () => printForm(r);
  $('detailEditBtn').onclick = () => { closeDetail(); editEntry(id); };
  $('detailOverlay').classList.add('open');
  loadBerkas(r);
}
function closeDetail() { detailToken++; $('detailOverlay').classList.remove('open'); }
async function loadBerkas(r) {
  const token = ++detailToken;
  for (let i = 0; i < BERKAS.length; i++) {
    const b = BERKAS[i]; if (!fileIdOf(r, b.col)) continue;
    try {
      const src = await getFile(r, b.col);
      if (token !== detailToken) return;
      const nama = String(r['Nama Lengkap'] || 'nasabah').replace(/[^\w\- ]+/g, '').trim();
      $('berkas' + i).innerHTML = `<img src="${src}" alt="${kEsc(b.label)}"><a class="dl" href="${src}" download="${kEsc(nama)}_${b.slug}.${src.startsWith('data:image/png') ? 'png' : 'jpg'}">⬇️ Download</a>`;
    } catch (err) { if (token === detailToken) $('berkas' + i).textContent = 'Gagal memuat: ' + err.message; }
  }
}

/* ---------- Cetak ---------- */
async function printForm(r) {
  const w = window.open('', '_blank');   // dibuka dulu agar tidak diblokir popup
  if (!w) { alert('Izinkan pop-up untuk situs ini, lalu coba lagi.'); return; }
  w.document.write('<p style="font-family:Arial">Menyiapkan cetakan... (mengunduh berkas, bisa sampai 30 detik)</p>');
  try {
    const { img, failed } = await kLoadImages(r, getFile, fileIdOf);
    if (failed.length && !confirm('Gagal memuat: ' + failed.join(', ') + '.\nLanjut cetak tanpa berkas itu?')) { w.close(); return; }
    w.document.open(); w.document.write(kRender(r, img, true)); w.document.close();
  } catch (err) {
    console.error(err);
    w.document.body.innerHTML = '<p style="font-family:Arial;color:#b91c1c">Gagal menyiapkan cetakan: ' + kEsc(err.message) + '</p>';
  }
}

/* ---------- Tambah / Edit ---------- */
let editingId = null;
kBind($('formBody'));

function buildForm(r) {
  $('formBody').innerHTML = KREDIT_GROUPS.map(g => `
    <div class="sec">${kEsc(g.t)}</div>
    <div class="grid">${g.f.map(f => kFieldHtml(f, 'm_')).join('')}</div>`).join('');
  kFill($('formBody'), r);
  $('fileBody').innerHTML = BERKAS.map(b => `
    <div class="field"><label>${kEsc(berkasLabel(b, r))}</label>
      <input type="file" accept="image/jpeg,image/png,image/webp" data-col="${b.col}">
      <small>${r && fileIdOf(r, b.col) ? 'Sudah ada. Pilih file hanya jika ingin menggantinya.' : 'Belum ada berkas.'}</small></div>`).join('') + `
    <div class="field full"><label>Nama Dokumen Lainnya</label>
      <input type="text" id="docNameEdit" placeholder="Isi jika mengupload Dokumen Lainnya" value="${r && r['Nama Dokumen Lainnya'] && r['Nama Dokumen Lainnya'] !== '-' ? kEsc(r['Nama Dokumen Lainnya']) : ''}"></div>`;
}
function openAdd() {
  if (!ADMIN_KEY) { openLogin(); return; }
  editingId = null; $('modalTitle').textContent = 'Tambah Data';
  buildForm(null); $('modalOverlay').classList.add('open');
}
function editEntry(id) {
  const r = records.find(x => x['ID'] === id); if (!r) return;
  editingId = id; $('modalTitle').textContent = 'Edit Data';
  buildForm(r); $('modalOverlay').classList.add('open');
}
function closeModal() { $('modalOverlay').classList.remove('open'); }

async function saveEntry() {
  const url = getUrl();
  if (!url || !ADMIN_KEY) { alert('Login dulu.'); return; }
  const { data, bad } = kCollect($('formBody'));
  if (bad) { bad.focus(); alert('Lengkapi semua isian bertanda * (termasuk kolom "Sebutkan lainnya").'); return; }
  const btn = $('btnSave'); btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    for (const inp of document.querySelectorAll('#fileBody input[type=file]')) {
      const f = inp.files[0]; if (!f) continue;
      if (!/^image\/(jpeg|png|webp)$/.test(f.type)) throw new Error('Format gambar harus JPG, PNG, atau WEBP.');
      data[inp.dataset.col] = await kCompress(f, ['Tanda Tangan', 'Tanda Tangan 2'].includes(inp.dataset.col) ? 700 : 1400);
    }
    const nm = $('docNameEdit').value.trim();
    if (data['Scan Dokumen Lainnya'] && !nm) throw new Error('Ketik nama dokumen untuk file "Lainnya".');
    if (nm) data['Nama Dokumen Lainnya'] = nm;
    if (!editingId) data['Submission ID'] = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
    const payload = editingId ? { action: 'update', id: editingId, data, key: ADMIN_KEY } : { action: 'create', data, key: ADMIN_KEY };
    const json = await (await fetch(url, { method: 'POST', body: JSON.stringify(payload) })).json();
    if (!json.success) throw new Error(json.message);
    closeModal(); loadData();
  } catch (err) { alert('Gagal menyimpan: ' + err.message); }
  finally { btn.disabled = false; btn.textContent = 'Simpan'; }
}

/* ---------- Hapus & Export ---------- */
async function deleteEntry(id) {
  if (!confirm('Hapus data ini beserta berkasnya?')) return;
  try {
    const json = await (await fetch(getUrl(), { method: 'POST', body: JSON.stringify({ action: 'delete', id, key: ADMIN_KEY }) })).json();
    if (!json.success) throw new Error(json.message);
    loadData();
  } catch (err) { alert('Gagal menghapus: ' + err.message); }
}
function exportExcel() {
  if (!records.length) { alert('Tidak ada data untuk diexport.'); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(records), 'Kredit');
  XLSX.writeFile(wb, `pengajuan-kredit-${new Date().toISOString().slice(0, 10)}.xlsx`);
}
</script>
</body>
</html>
